services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic_dev_pw
      POSTGRES_DB: clinicconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinicconnect"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
